name: reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit and contract tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify public repository safety
        run: uv run python scripts/assert_public_repo_safety.py --root .
      - name: Verify V3 transcript crosscheck
        run: |
          uv run python benchmark/generate_crosscheck_v3.py --output-dir /tmp/v3
          uv run python benchmark/run_crosscheck_benchmark.py --text-layer /tmp/v3/text_layer.json --ocr-transcript /tmp/v3/ocr_transcript.json --labels /tmp/v3/labels.json --output /tmp/v3/results.json
      - name: Verify V4 deterministic component fixtures
        run: |
          uv run python benchmark/generate_dataset_v4.py --output-dir /tmp/v4
          uv run python benchmark/run_v4_fixture_check.py --pages /tmp/v4/all-pages.json --manifest /tmp/v4/manifest.json --output /tmp/v4/check.json
          uv run python -m json.tool /tmp/v4/all-pages.json >/dev/null
          uv run python -m json.tool /tmp/v4/manifest.json >/dev/null
