[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docling-cn-pdf-heal"
version = "0.4.0"
description = "Explainable quality checks and selective OCR routing for corrupted Chinese PDF text layers."
requires-python = ">=3.10"
dependencies = [
    "docling>=2.129.0",
    "pypdf>=6.0",
    "reportlab>=4.0",
]
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "AIC team" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
pdf-heal = "docling_cn_pdf_heal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
